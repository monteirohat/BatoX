<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B1120">
<title>BatoX</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/components/upload-queue.css">
<link rel="stylesheet" href="css/components/modal.css">
<link rel="stylesheet" href="css/views/dashboard.css">
<link rel="stylesheet" href="css/views/games.css">
<link rel="stylesheet" href="css/views/music.css">
<link rel="stylesheet" href="css/views/es.css">
<link rel="stylesheet" href="css/views/messages.css">
<link rel="stylesheet" href="css/views/batocera.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <a class="brand" href="#dashboard" aria-label="BatoX">
      <img src="img/mark.svg" width="58" height="36" alt="">
      <img src="img/wordmark.svg" width="94" height="26" alt="BatoX">
    </a>
    <a class="nav-link" href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="long">Dashboard</span><span class="short">Home</span></a>
    <a class="nav-link" href="#games" data-view="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6v5H9zM9 17v1M12 17v1M15 17v1"/></svg>Games</a>
    <a class="nav-link" href="#upload" data-view="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>Upload</a>
    <a class="nav-link" href="#music" data-view="music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Music</a>
    <a class="nav-link" href="#messages" data-view="messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 14h4.5"/></svg><span class="long">Messages</span><span class="short">Msgs</span></a>
    <a class="nav-link" href="#es" data-view="es"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"/></svg><span class="long">EmulationStation</span><span class="short">ES</span></a>
    <a class="nav-link" href="#batocera" data-view="batocera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="long">Batocera</span><span class="short">Config</span></a>
    <a class="nav-link" href="#logs" data-view="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Logs</a>
    <a class="nav-link" href="#access" data-view="access"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg>Access</a>
    <div class="rail-foot">
      <div class="conn" id="conn" data-state="idle"><i></i><span>Connecting…</span></div>
      <a class="rail-version" id="rail-version" target="_blank" rel="noopener" hidden></a>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>

<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-msg"></p>
    <div class="actions" style="justify-content:flex-end">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn btn-primary" value="ok" id="confirm-ok"></button>
    </div>
  </form>
</dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
