name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: make build-arm64 build-amd64 VERSION=${GITHUB_REF_NAME}

      - name: Collect release files
        run: |
          mkdir dist
          cp build/batox-linux-arm64 build/batox-linux-amd64 scripts/batox config.example.json dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
