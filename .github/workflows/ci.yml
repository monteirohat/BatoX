name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build (arm64 and amd64)
        run: make build-arm64 build-amd64

      - name: Check shell scripts
        run: bash -n scripts/deploy.sh && bash -n scripts/batox
