name: Feature request
description: Suggest an idea for BatoX
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to achieve, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could BatoX help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
